[package]
name = "card-images"
version = "0.1.0"
edition = "2021"

[dependencies]
card-placeholder = { path = "../card-placeholder" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
