[package]
name = "index-refresh"
version = "0.1.0"
edition = "2021"
description = "Find Pokemon cards missing from the cdn_milo server index, stage their faces, and enrich index metadata."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
